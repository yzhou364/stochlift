name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}${{ matrix.extra && format(' / {0}', matrix.extra) || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python: "3.11"
            extra: pulp3          # the PuLP 2/3 API that most existing models use
          - os: ubuntu-latest
            python: "3.12"
            extra: gurobi-ortools # size-limited gurobipy license, OR-Tools, mpi-sppy export
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Pin PuLP 3
        if: matrix.extra == 'pulp3'
        run: python -m pip install "pulp>=3,<4"
      - name: Gurobi and OR-Tools
        if: matrix.extra == 'gurobi-ortools'
        run: python -m pip install gurobipy ortools mpi-sppy
      - name: Test
        run: python -m pytest -q -rs
      - name: Command line smoke test
        working-directory: examples/farmer
        run: |
          stochlift --version
          stochlift run model.py --spec uncertainty_distribution.yaml --out ${{ runner.temp }}/report -q --no-figures
