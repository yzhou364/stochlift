[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stochlift"
version = "0.2.0"
description = "Turn a deterministic optimization model into a verified two-stage stochastic program, and measure whether it is worth it."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yuqun Zhou"}]
keywords = ["stochastic programming", "operations research", "optimization under uncertainty", "value of the stochastic solution", "PuLP", "Pyomo", "gurobipy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.23", "scipy>=1.10", "highspy>=1.7", "pandas>=1.5", "pyyaml>=6", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/yzhou364/stochlift"
Source = "https://github.com/yzhou364/stochlift"
Issues = "https://github.com/yzhou364/stochlift/issues"
Changelog = "https://github.com/yzhou364/stochlift/blob/main/CHANGELOG.md"

[project.scripts]
stochlift = "stochlift.cli:main"

[project.optional-dependencies]
pulp = ["pulp>=2.7"]
pyomo = ["pyomo>=6.6"]
gurobi = ["gurobipy>=10"]
ortools = ["ortools>=9.8"]
anthropic = ["anthropic"]
openai = ["openai"]
dev = ["pytest", "pulp", "pyomo"]
all = ["pulp>=2.7", "pyomo>=6.6", "anthropic", "openai"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pulp"]
