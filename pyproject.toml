[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stochlift"
version = "0.1.0"
description = "Lift a deterministic optimization model to a verified two-stage stochastic program and measure whether it is worth it."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Yuqun Zhou"}]
keywords = ["stochastic programming", "operations research", "optimization", "LLM", "uncertainty"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.23", "scipy>=1.10", "highspy>=1.7", "pandas>=1.5", "pyyaml>=6", "matplotlib>=3.7"]

[project.scripts]
stochlift = "stochlift.cli:main"

[project.optional-dependencies]
pulp = ["pulp>=2.7"]
pyomo = ["pyomo>=6.6"]
gurobi = ["gurobipy>=10"]
ortools = ["ortools>=9.8"]
anthropic = ["anthropic"]
openai = ["openai"]
dev = ["pytest", "pulp", "pyomo"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pulp"]
