# Load is uncertain and strongly correlated across blocks (a hot year raises all of them).
# The planner dislikes years with large shortages: half the weight is on the worst 10% of years.
first_stage:
- cap[*]
uncertain:
- load
scenarios:
  method: distribution
  n: 200
  n_test: 1000
  seed: 0
  correlation: 0.8
  distributions:
    load: {dist: normal, cv: 0.15, min: 0}
risk:
  alpha: 0.9
  weight: 0.5
notes: Capacity is built years ahead (first stage); dispatch and unserved load follow the actual load.
